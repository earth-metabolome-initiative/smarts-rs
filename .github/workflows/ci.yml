name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked

      - name: Run tests
        run: cargo test --workspace --all-features --locked

  msrv:
    name: Minimum Supported Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check without default features
        run: cargo check -p smarts-rs --lib --no-default-features --locked

      - name: Check all features
        run: cargo check -p smarts-rs --lib --all-features --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: smarts
          POSTGRES_USER: smarts
          POSTGRES_PASSWORD: smarts-ci
        ports:
          - 127.0.0.1::5432
        options: --health-cmd "pg_isready -h 127.0.0.1 -U smarts -d smarts" --health-interval 2s --health-timeout 3s --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: smarts-ci-root
          MARIADB_DATABASE: smarts
          MARIADB_USER: smarts
          MARIADB_PASSWORD: smarts-ci
        ports:
          - 127.0.0.1::3306
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-timeout 3s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: smarts-ci-root
          MYSQL_DATABASE: smarts
          MYSQL_USER: smarts
          MYSQL_PASSWORD: smarts-ci
        ports:
          - 127.0.0.1::3306
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -u smarts -psmarts-ci" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-llvm-cov
      - name: Install database clients
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libpq-dev default-libmysqlclient-dev

      - name: Collect workspace coverage
        run: cargo llvm-cov --locked --workspace --all-features --doctests --no-report

      - name: Test SQLite in memory
        run: cargo llvm-cov --locked --no-report --no-default-features --features diesel-sqlite --test diesel_sqlite

      - name: Test PostgreSQL
        env:
          POSTGRES_DATABASE_URL: postgresql://smarts:smarts-ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/smarts?connect_timeout=5
        run: cargo llvm-cov --locked --no-report --no-default-features --features diesel-postgres,diesel/postgres --test diesel_postgres -- --ignored

      - name: Test MariaDB
        env:
          MARIADB_DATABASE_URL: mariadb://smarts:smarts-ci@127.0.0.1:${{ job.services.mariadb.ports['3306'] }}/smarts
        run: cargo llvm-cov --locked --no-report --no-default-features --features diesel-mariadb,diesel/mariadb --test diesel_mariadb -- --ignored

      - name: Test MySQL
        env:
          MYSQL_DATABASE_URL: mysql://smarts:smarts-ci@127.0.0.1:${{ job.services.mysql.ports['3306'] }}/smarts
        run: cargo llvm-cov --locked --no-report --no-default-features --features diesel-mysql,diesel/mysql --test diesel_mysql -- --ignored

      - name: Generate combined coverage report
        run: cargo llvm-cov report --doctests --fail-under-lines 90 --lcov --output-path target/coverage.lcov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: target/coverage.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: target/coverage.lcov
          verbose: true

  sanitizers:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # AddressSanitizer requires the unstable -Zsanitizer flag, so this job
      # runs on nightly. It guards the unsafe epserde/mmap deserialization and
      # *_unchecked APIs against memory errors and leaks.
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run tests under AddressSanitizer (with LeakSanitizer)
        env:
          # -Zsanitizer instruments only the --target build, never host build
          # scripts or proc-macros, so an explicit --target is mandatory below.
          # std is not rebuilt: ASAN replaces the global allocator at runtime,
          # which is enough for LeakSanitizer to track every allocation.
          RUSTFLAGS: "-Zsanitizer=address"
          # LeakSanitizer is on by default on Linux; set it explicitly so the
          # intent is visible. One test deliberately leaks deeply nested trees
          # (dropping them would overflow the stack) and turns this off only for
          # its own child process.
          ASAN_OPTIONS: "detect_leaks=1"
          RUST_BACKTRACE: "1"
        run: >
          cargo test
          --tests
          --all-features
          --locked
          --target x86_64-unknown-linux-gnu
