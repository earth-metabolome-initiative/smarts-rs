name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked

      - name: Run tests
        run: cargo test --workspace --all-features --locked

  msrv:
    name: Minimum Supported Rust
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check without default features
        run: cargo check -p smarts-rs --lib --no-default-features --locked

      - name: Check all features
        run: cargo check -p smarts-rs --lib --all-features --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-llvm-cov

      - name: Run coverage
        run: >
          cargo llvm-cov
          --workspace
          --all-features
          --doctests
          --fail-under-lines 90
          --lcov
          --output-path target/coverage.lcov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: target/coverage.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: target/coverage.lcov
          verbose: true

  sanitizers:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # AddressSanitizer requires the unstable -Zsanitizer flag, so this job
      # runs on nightly. It guards the unsafe epserde/mmap deserialization and
      # *_unchecked APIs against memory errors and leaks.
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Run tests under AddressSanitizer (with LeakSanitizer)
        env:
          # -Zsanitizer instruments only the --target build, never host build
          # scripts or proc-macros, so an explicit --target is mandatory below.
          # std is not rebuilt: ASAN replaces the global allocator at runtime,
          # which is enough for LeakSanitizer to track every allocation.
          RUSTFLAGS: "-Zsanitizer=address"
          # LeakSanitizer is on by default on Linux; set it explicitly so the
          # intent is visible. One test deliberately leaks deeply nested trees
          # (dropping them would overflow the stack) and turns this off only for
          # its own child process.
          ASAN_OPTIONS: "detect_leaks=1"
          RUST_BACKTRACE: "1"
        run: >
          cargo test
          --tests
          --all-features
          --locked
          --target x86_64-unknown-linux-gnu
