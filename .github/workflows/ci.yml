name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked

      - name: Run tests
        run: cargo test --workspace --all-features --locked

  links:
    name: Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links
        # Pinned to a master commit rather than a release tag on purpose. The
        # latest release (v2.8.0) defaults to lychee 0.23.0, which panics in CI
        # with a tokio SendError (lychee #2091, fixed by lychee #2074 in 0.24.x),
        # and its install step only handles the old flat archive layout, so it
        # cannot install any 0.24.x build (those nest the binary in a subfolder).
        # This commit defaults to lychee 0.24.2 and auto-detects the nested
        # binary (lychee-action #330). Revert to a tag once one ships with both.
        uses: lycheeverse/lychee-action@6da1d14f3a43098a294b7696d93d938aa8d20fc0
        with:
          args: --no-progress README.md docs/

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Run coverage
        run: >
          cargo tarpaulin
          --workspace
          --all-features
          --engine llvm
          --exclude-files 'fuzz/*'
          --fail-under 90
          --out Xml
          --output-dir coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          directory: coverage
          verbose: true
