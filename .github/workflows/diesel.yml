name: Diesel

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: diesel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codecs:
    name: Diesel codec dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.92.0
          targets: x86_64-unknown-none
      - name: Check SQLite on bare metal
        run: cargo check --locked --lib --no-default-features --features diesel-sqlite --target x86_64-unknown-none
      - name: Exclude native server clients from each codec
        run: |
          for feature in diesel-sqlite diesel-postgres diesel-mariadb diesel-mysql; do
            tree=$(cargo tree --locked --no-default-features --features "$feature" --edges normal --prefix none --color never)
            if grep -E '^(pq-sys|mysqlclient-sys) ' <<< "$tree"; then
              echo "::error::$feature depends on a native server client"
              exit 1
            fi
          done
