name: Diesel

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: diesel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codecs:
    name: Diesel codec dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.92.0
          targets: x86_64-unknown-none
      - name: Check SQLite on bare metal
        run: cargo check --locked --lib --no-default-features --features diesel-sqlite --target x86_64-unknown-none
      - name: Exclude native server clients from each codec
        run: |
          for feature in diesel-sqlite diesel-postgres diesel-mariadb diesel-mysql; do
            tree=$(cargo tree --locked --no-default-features --features "$feature" --edges normal --prefix none --color never)
            if grep -E '^(pq-sys|mysqlclient-sys) ' <<< "$tree"; then
              echo "::error::$feature depends on a native server client"
              exit 1
            fi
          done

  storage:
    name: Diesel text storage
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: smarts
          POSTGRES_USER: smarts
          POSTGRES_PASSWORD: smarts-ci
        ports:
          - 127.0.0.1::5432
        options: --health-cmd "pg_isready -h 127.0.0.1 -U smarts -d smarts" --health-interval 2s --health-timeout 3s --health-retries 30
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: smarts-ci-root
          MARIADB_DATABASE: smarts
          MARIADB_USER: smarts
          MARIADB_PASSWORD: smarts-ci
        ports:
          - 127.0.0.1::3306
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 2s --health-timeout 3s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: smarts-ci-root
          MYSQL_DATABASE: smarts
          MYSQL_USER: smarts
          MYSQL_PASSWORD: smarts-ci
        ports:
          - 127.0.0.1::3306
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -u smarts -psmarts-ci" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install database clients
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libpq-dev default-libmysqlclient-dev
      - name: Test SQLite in memory
        run: cargo test --locked --no-default-features --features diesel-sqlite --test diesel_sqlite
      - name: Test PostgreSQL
        env:
          POSTGRES_DATABASE_URL: postgresql://smarts:smarts-ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/smarts?connect_timeout=5
        run: cargo test --locked --no-default-features --features diesel-postgres,diesel/postgres --test diesel_postgres -- --include-ignored
      - name: Test MariaDB
        env:
          MARIADB_DATABASE_URL: mariadb://smarts:smarts-ci@127.0.0.1:${{ job.services.mariadb.ports['3306'] }}/smarts
        run: cargo test --locked --no-default-features --features diesel-mariadb,diesel/mariadb --test diesel_mariadb -- --include-ignored
      - name: Test MySQL
        env:
          MYSQL_DATABASE_URL: mysql://smarts:smarts-ci@127.0.0.1:${{ job.services.mysql.ports['3306'] }}/smarts
        run: cargo test --locked --no-default-features --features diesel-mysql,diesel/mysql --test diesel_mysql -- --include-ignored
